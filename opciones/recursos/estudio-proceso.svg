<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="t">
<title id="t">Cómo trabajo: entender el problema, estudiar la competencia, diseñar, construir y probar en un celular real</title>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,sans-serif} .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.bar{transform-box:view-box;transform-origin:90px 64px;animation:bar 9.0s infinite}
@keyframes bar{0%{transform:scaleX(0);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}66.67%{transform:scaleX(1)}92%{transform:scaleX(1);opacity:1}97%{opacity:0}100%{transform:scaleX(0);opacity:0}}
.n0{animation:n0 9.0s infinite}@keyframes n0{0%{fill:#0F100D}0.00%{fill:#0F100D}0.00%{fill:#C6F432}92%{fill:#C6F432}97%{fill:#0F100D}100%{fill:#0F100D}}
.n1{animation:n1 9.0s infinite}@keyframes n1{0%{fill:#0F100D}16.17%{fill:#0F100D}16.67%{fill:#C6F432}92%{fill:#C6F432}97%{fill:#0F100D}100%{fill:#0F100D}}
.n2{animation:n2 9.0s infinite}@keyframes n2{0%{fill:#0F100D}32.83%{fill:#0F100D}33.33%{fill:#C6F432}92%{fill:#C6F432}97%{fill:#0F100D}100%{fill:#0F100D}}
.n3{animation:n3 9.0s infinite}@keyframes n3{0%{fill:#0F100D}49.50%{fill:#0F100D}50.00%{fill:#C6F432}92%{fill:#C6F432}97%{fill:#0F100D}100%{fill:#0F100D}}
.n4{animation:n4 9.0s infinite}@keyframes n4{0%{fill:#0F100D}66.17%{fill:#0F100D}66.67%{fill:#C6F432}92%{fill:#C6F432}97%{fill:#0F100D}100%{fill:#0F100D}}

@media (prefers-reduced-motion:reduce){.bar{animation:none}.n0{animation:none;fill:#C6F432}.n1{animation:none;fill:#C6F432}.n2{animation:none;fill:#C6F432}.n3{animation:none;fill:#C6F432}.n4{animation:none;fill:#C6F432}}
</style>
<rect width="900" height="180" rx="18" fill="#0F100D"/>
<line x1="90" y1="64" x2="810" y2="64" stroke="#EDEBE4" stroke-opacity="0.14" stroke-width="2"/>
<line class="bar" x1="90" y1="64" x2="810" y2="64" stroke="#C6F432" stroke-width="2"/>
<circle class="n0" cx="90.0" cy="64" r="7" fill="#0F100D" stroke="#C6F432" stroke-width="2"/><text x="90.0" y="104" text-anchor="middle" class="mono" font-size="12" fill="#C6F432">01</text><text x="90.0" y="128" text-anchor="middle" class="sans" font-size="15" fill="#EDEBE4">Entender</text><text x="90.0" y="148" text-anchor="middle" class="sans" font-size="15" fill="#8C8A82">el problema</text><circle class="n1" cx="270.0" cy="64" r="7" fill="#0F100D" stroke="#C6F432" stroke-width="2"/><text x="270.0" y="104" text-anchor="middle" class="mono" font-size="12" fill="#C6F432">02</text><text x="270.0" y="128" text-anchor="middle" class="sans" font-size="15" fill="#EDEBE4">Estudiar la</text><text x="270.0" y="148" text-anchor="middle" class="sans" font-size="15" fill="#8C8A82">competencia</text><circle class="n2" cx="450.0" cy="64" r="7" fill="#0F100D" stroke="#C6F432" stroke-width="2"/><text x="450.0" y="104" text-anchor="middle" class="mono" font-size="12" fill="#C6F432">03</text><text x="450.0" y="128" text-anchor="middle" class="sans" font-size="15" fill="#EDEBE4">Diseñar</text><text x="450.0" y="148" text-anchor="middle" class="sans" font-size="15" fill="#8C8A82">la experiencia</text><circle class="n3" cx="630.0" cy="64" r="7" fill="#0F100D" stroke="#C6F432" stroke-width="2"/><text x="630.0" y="104" text-anchor="middle" class="mono" font-size="12" fill="#C6F432">04</text><text x="630.0" y="128" text-anchor="middle" class="sans" font-size="15" fill="#EDEBE4">Construir</text><text x="630.0" y="148" text-anchor="middle" class="sans" font-size="15" fill="#8C8A82">el producto</text><circle class="n4" cx="810.0" cy="64" r="7" fill="#0F100D" stroke="#C6F432" stroke-width="2"/><text x="810.0" y="104" text-anchor="middle" class="mono" font-size="12" fill="#C6F432">05</text><text x="810.0" y="128" text-anchor="middle" class="sans" font-size="15" fill="#EDEBE4">Probar en un</text><text x="810.0" y="148" text-anchor="middle" class="sans" font-size="15" fill="#8C8A82">celular real</text>
</svg>
