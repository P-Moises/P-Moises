<text x="58" y="58" class="serif" font-size="30" font-style="italic" fill="#B8492A">01</text><text x="58" y="112" class="sans" font-size="15" font-weight="600" fill="#1D1B18">Entender</text><text x="58" y="132" class="sans" font-size="15" fill="#7A746B">el problema</text><text x="226" y="58" class="serif" font-size="30" font-style="italic" fill="#B8492A">02</text><text x="226" y="112" class="sans" font-size="15" font-weight="600" fill="#1D1B18">Estudiar la</text><text x="226" y="132" class="sans" font-size="15" fill="#7A746B">competencia</text><text x="394" y="58" class="serif" font-size="30" font-style="italic" fill="#B8492A">03</text><text x="394" y="112" class="sans" font-size="15" font-weight="600" fill="#1D1B18">Diseñar</text><text x="394" y="132" class="sans" font-size="15" fill="#7A746B">la experiencia</text><text x="562" y="58" class="serif" font-size="30" font-style="italic" fill="#B8492A">04</text><text x="562" y="112" class="sans" font-size="15" font-weight="600" fill="#1D1B18">Construir</text><text x="562" y="132" class="sans" font-size="15" fill="#7A746B">el producto</text><text x="730" y="58" class="serif" font-size="30" font-style="italic" fill="#B8492A">05</text><text x="730" y="112" class="sans" font-size="15" font-weight="600" fill="#1D1B18">Probar en un</text><text x="730" y="132" class="sans" font-size="15" fill="#7A746B">celular real</text>
